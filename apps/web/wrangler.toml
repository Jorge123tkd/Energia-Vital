name = "energia-vital-web"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

# Only production may access the existing API through its private service binding.
[[env.production.services]]
binding = "ADMIN_SESSION_API"
service = "energia-vital-api"

[[env.production.services]]
binding = "STUDIO_API"
service = "evpro-sync-api"
