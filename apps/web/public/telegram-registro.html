<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Cuenta Bonaire</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:var(--tg-theme-bg-color,#f3f8fa);color:var(--tg-theme-text-color,#163344);margin:0;padding:22px}main{max-width:440px;margin:auto}h1{font-size:25px;margin:8px 0}p{line-height:1.45}label{display:block;font-weight:600;margin:12px 0}input{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #94a3b8;border-radius:9px;font:inherit;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#087f83;color:white;font:inherit;font-weight:bold;margin:8px 0}button:disabled{opacity:.5}#status{white-space:pre-wrap} [hidden]{display:none!important}
</style></head><body><main><h1>Bonaire · Energía Vital</h1><p>Crea tu cuenta web desde Telegram o vincula una cuenta existente. Nunca escribas tu contraseña en el chat.</p><button id="toggle" type="button">Ya tengo una cuenta</button><form id="form"><div id="new"><label>Nombre completo<input name="name" required minlength="3" maxlength="120" autocomplete="name"></label><label>Teléfono<input name="phone" type="tel" required maxlength="25" autocomplete="tel"></label><label>Dirección<input name="address" required minlength="6" maxlength="250" autocomplete="street-address"></label><label>Municipio<input name="city" required minlength="2" maxlength="100"></label><label>Provincia<input name="province" required minlength="2" maxlength="100"></label></div><label>Correo electrónico<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Contraseña<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label><p>Tu cuenta quedará vinculada a este Telegram. El teléfono que escribas no se marcará como verificado.</p><button id="submit" type="submit">Crear y vincular cuenta</button></form><p id="status" role="status" aria-live="polite"></p><button id="close" hidden>Cerrar y volver al bot</button></main><script>
'use strict';const tg=window.Telegram?.WebApp,form=document.querySelector('#form'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle'),submit=document.querySelector('#submit'),close=document.querySelector('#close'),newFields=document.querySelector('#new');let link=false;tg?.ready();tg?.expand();
if(!tg?.initData){status.textContent='Abre este formulario desde el bot de Bonaire.';form.hidden=true;toggle.hidden=true;}
toggle.addEventListener('click',()=>{link=!link;newFields.hidden=link;newFields.querySelectorAll('input').forEach(x=>x.disabled=link);form.elements.password.minLength=link?1:10;form.elements.password.autocomplete=link?'current-password':'new-password';toggle.textContent=link?'Crear una cuenta nueva':'Ya tengo una cuenta';submit.textContent=link?'Vincular cuenta existente':'Crear y vincular cuenta';status.textContent='';});
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;toggle.disabled=true;status.textContent='Procesando…';const payload=Object.fromEntries(new FormData(form));payload.init_data=tg.initData;try{const body=JSON.stringify(payload);delete payload.password;form.elements.password.value='';const res=await fetch('https://energia-vital-api.astrustrus.workers.dev/api/auth/telegram/'+(link?'link':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body,cache:'no-store',credentials:'omit'});const data=await res.json();status.textContent=data.message||data.error||'No se pudo completar la operación.';if(res.ok){form.reset();form.hidden=true;toggle.hidden=true;close.hidden=false;}}catch{status.textContent='Error de conexión. Si el registro pudo completarse, vuelve al bot y comprueba tu cuenta.';}finally{submit.disabled=false;toggle.disabled=false;}});close.addEventListener('click',()=>tg?.close());
</script></body></html>
