name: Bonaire - validacion previa de QA sin despliegue
on:
  push:
    branches:
      - feat/cloudflare-customer-accounts-hardening
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-code-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias del lockfile
        run: npm ci
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
      - name: Verificar aislamiento QA y reglas Access (datos sinteticos)
        run: |
          node scripts/prepare-cloudflare-qa-config.test.cjs
          node scripts/verify-qa-access.test.cjs
      - name: Probar conversaciones con empresas y proveedores en Telegram y web
        run: node apps/api/tests/business-assistant-phase-a.cjs
      - name: Probar solicitudes comerciales, citas y documentos
        run: |
          node apps/api/tests/assistant-usage.cjs
          node apps/api/tests/commercial-intake.cjs
          node apps/api/tests/telegram-customer-auth.cjs
          node apps/api/tests/telegram-customer-appointments.cjs
          node apps/api/tests/request-documents.cjs
      - name: Typecheck API y Svelte
        run: |
          npm run typecheck --workspace=apps/api
          npm run typecheck --workspace=apps/web
      - name: Compilar frontend
        run: npm run build --workspace=apps/web
      - name: Revisar _routes.json en dist para Studio y sesiones
        run: node apps/web/tests/pages-build-output.mjs
      - name: Probar protecciones de sesion
        run: |
          node apps/web/tests/auth-session.cjs
          node apps/web/tests/admin-browser-session.cjs
          node apps/web/tests/studio-bridge.test.mjs
      - name: Compilar Pages Functions sin servidor
        working-directory: apps/web
        run: npx wrangler pages functions build functions --outfile "$RUNNER_TEMP/bonaire-session.js" --output-routes-path "$RUNNER_TEMP/bonaire-routes.json"
      - name: Verificar y registrar paquete Pages, sin publicación
        run: node apps/web/tests/pages-package-preflight.mjs "$RUNNER_TEMP/bonaire-session.js" "$RUNNER_TEMP/bonaire-routes.json" "$RUNNER_TEMP/bonaire-pages-preflight.json"
      - name: Conservar manifiesto de prepublicación (solo hashes, sin binarios ni secretos)
        uses: actions/upload-artifact@v4
        with:
          name: bonaire-pages-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/bonaire-pages-preflight.json
          retention-days: 14
          if-no-files-found: error
      - name: Ensayar migraciones en memoria con registros ficticios
        run: python3 apps/api/tests/migration-preservation.py
