name: Svelte dedupe audit and isolated CI
on:
  push:
    branches: [security/dedupe-svelte-20261116]
    paths: [docs/TRIGGER-SVELTE-DEDUPE.md]

permissions:
  contents: write

concurrency:
  group: svelte-dedupe-ci-once
  cancel-in-progress: false

jobs:
  checks:
    name: API, web y pruebas reales con D1 aislada
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerar árbol npm sin cambiar manifiestos
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm dedupe --ignore-scripts --no-audit --no-fund
          git diff --name-only > "$RUNNER_TEMP/diff.txt"
          if grep -Ev '^package-lock\.json$' "$RUNNER_TEMP/diff.txt"; then
            echo "Un cambio fuera del lockfile requiere revisión"; exit 1
          fi
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const versions=Object.entries(lock.packages||{}).filter(([k])=>
            k==='node_modules/svelte'||k.endsWith('/node_modules/svelte'))
            .map(([k,v])=>({path:k,version:v.version,hasIntegrity:!!v.integrity}));
          console.log('Svelte resuelto después de dedupe:',JSON.stringify(versions));
          if(!versions.length||versions.some(v=>v.version.startsWith('4.')||!v.hasIntegrity))
            throw Error('Se conservó una instalación Svelte 4 o sin integridad');
          NODE

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias npm (solo resumen; no publica)
        run: node scripts/dependency-audit.cjs

      - name: Auditar resultado sin alertas graves ni Svelte
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/dedupe-audit.json" || true
          node - "$RUNNER_TEMP/dedupe-audit.json" <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const v=a.metadata?.vulnerabilities;
          if(!v||!Number.isInteger(v.high)||!Number.isInteger(v.critical))
            throw Error('Auditoría npm sin resultado verificable');
          console.log('Conteos tras dedupe:',JSON.stringify(v));
          if(a.vulnerabilities?.svelte)throw Error('Svelte continúa con aviso de seguridad');
          if(v.high||v.critical)throw Error('Dedupe introdujo vulnerabilidades graves');
          NODE

      - name: Validar TypeScript API
        run: npm run typecheck --workspace=apps/api

      - name: Validar Svelte y TypeScript
        run: npm run typecheck --workspace=apps/web

      - name: Construir frontend (sin publicar)
        run: npm run build --workspace=apps/web

      - name: Ensayo de preservación de datos históricos ficticios (sin Cloudflare real)
        run: python3 apps/api/tests/migration-preservation.py

      - name: Pruebas integrales en Worker y D1 temporales del runner
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:8787
          TEST_ADMIN_SETUP_KEY: ClaveSetupCIExclusivaParaPruebasDe36Caracteres123
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          WORKER_PID=""
          cleanup() {
            if [[ -n "$WORKER_PID" ]]; then
              kill "$WORKER_PID" 2>/dev/null || true
              wait "$WORKER_PID" 2>/dev/null || true
            fi
            rm -rf "$SANDBOX"
          }
          trap cleanup EXIT

          cd apps/api
          npx wrangler d1 migrations apply energia-vital-db --local --persist-to "$SANDBOX"

          npx wrangler dev --local --port 8787 --persist-to "$SANDBOX" \
            --var "JWT_SECRET:ClaveCIExclusivaParaPruebasDe36Caracteres123" \
            --var "ADMIN_SETUP_KEY:$TEST_ADMIN_SETUP_KEY" \
            >"$RUNNER_TEMP/bonaire-worker-ci.log" 2>&1 &
          WORKER_PID=$!

          HEALTH_OK=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 2 "$BASE_URL/health" >/dev/null; then
              HEALTH_OK=1
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then break; fi
            sleep 1
          done

          if [[ "$HEALTH_OK" != 1 ]]; then
            echo "No arrancó el Worker aislado de GitHub Actions."
            cat "$RUNNER_TEMP/bonaire-worker-ci.log"
            exit 1
          fi

          cd ../..
          npm test --workspace=apps/api

      - name: Confirmar que no hubo despliegue
        if: always()
        run: echo "Este flujo solo valida; no ejecuta wrangler deploy, Pages deploy ni migraciones remotas."

      - name: Guardar lockfile npm solo tras todas las pruebas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "npm dedupe no produjo cambio"
          else
            git commit -m "fix(deps): desduplicar Svelte antiguo con npm tras CI"
            git push origin HEAD:security/dedupe-svelte-20261116
          fi
