name: Diagnóstico Vite y Undici (solo lectura, sin despliegue)
on:
  push:
    branches: [security/vite-undici-20261116]
    paths: [docs/TRIGGER-VITE-UNDICI-AUDIT.md]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalación del lockfile actual
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Detalles mínimos del npm audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node - "$RUNNER_TEMP/audit.json" <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const name of ['vite','undici','hono','@sveltejs/vite-plugin-svelte',
             '@sveltejs/vite-plugin-svelte-inspector','miniflare','wrangler','esbuild','svelte']){
            const v=report.vulnerabilities?.[name];
            if(!v){console.log(name+': no reportado');continue;}
            const fix=v.fixAvailable===false?'sin fix automático':v.fixAvailable===true?'fix semver':
              JSON.stringify(v.fixAvailable);
            const advisories=(v.via||[]).filter(x=>x&&typeof x==='object').map(x=>
              x.title+' / '+x.range).slice(0,4);
            console.log(name+': '+JSON.stringify({severity:v.severity,range:v.range,
              isDirect:v.isDirect,fix,advisories}));
          }
          console.log('Totales: '+JSON.stringify(report.metadata?.vulnerabilities||{}));
          NODE
      - name: Versiones compatibles de registro público npm
        shell: bash
        run: |
          set -euo pipefail
          for pkg in vite undici wrangler @sveltejs/vite-plugin-svelte svelte; do
            printf '%s: ' "$pkg"
            npm view "$pkg" dist-tags.latest --json
          done
          echo "Vite major candidates:"
          for major in 6 7 8; do
            printf 'vite@%s: ' "$major"
            npm view "vite@$major" version --json | node -e "let a='';process.stdin.on('data',v=>a+=v);process.stdin.on('end',()=>{let x=JSON.parse(a);console.log(Array.isArray(x)?x.at(-1):x)})"
          done
          echo "Peer requirements from current and latest Svelte plugin:"
          npm view @sveltejs/vite-plugin-svelte@latest peerDependencies --json
          npm view @sveltejs/vite-plugin-svelte@5 peerDependencies --json | node -e "let a='';process.stdin.on('data',v=>a+=v);process.stdin.on('end',()=>{let x=JSON.parse(a);console.log(JSON.stringify(Array.isArray(x)?x.at(-1):x))})"
