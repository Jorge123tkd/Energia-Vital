name: Reparar Hono 4.13.18 - ejecución aislada y temporal
on:
  push:
    branches: [security/hono-4-13-18]
    paths: [docs/TRIGGER-HONO-UPDATE.md]

permissions:
  contents: write

concurrency:
  group: hono-patch-once
  cancel-in-progress: false

jobs:
  upgrade-and-test:
    if: github.repository == 'Jorge123tkd/Energia-Vital' && github.ref == 'refs/heads/security/hono-4-13-18'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerar lockfile con npm, sin scripts externos
        run: npm install hono@4.13.18 --workspace=apps/api --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Verificar que solo package-lock.json y package.json API cambian
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > "$RUNNER_TEMP/changed.txt"
          if grep -Ev '^(package-lock\.json|apps/api/package\.json)$' "$RUNNER_TEMP/changed.txt"; then
            echo "Se detectaron cambios de dependencias fuera del alcance aprobado."
            exit 1
          fi
          node - <<'NODE'
          const p=require('./package-lock.json');
          const matches=Object.entries(p.packages||{}).filter(([k])=>
            k==='node_modules/hono'||k.endsWith('/node_modules/hono'));
          if(!matches.length||matches.some(([,v])=>v.version!=='4.13.18'||!v.integrity)){
            throw new Error('Hono no está íntegro y actualizado a 4.13.18 en todos los nodos del lockfile');
          }
          console.log('Hono 4.13.18 en '+matches.length+' rutas de npm; integridad npm presente');
          NODE
      - name: Instalación reproducible
        run: npm ci
      - name: Typecheck API
        run: npm run typecheck --workspace=apps/api
      - name: Typecheck Svelte y web
        run: npm run typecheck --workspace=apps/web
      - name: Compilar la web
        run: npm run build --workspace=apps/web
      - name: Verificar migraciones sobre datos ficticios
        run: python3 apps/api/tests/migration-preservation.py
      - name: Auditoría de dependencias de producción sin datos sensibles
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > "$RUNNER_TEMP/runtime-audit.json" || true
          node - "$RUNNER_TEMP/runtime-audit.json" <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const counts=data.metadata?.vulnerabilities;
          if(!counts)throw new Error('npm audit no devolvió metadatos válidos');
          console.log('Runtime vulnerabilities:',JSON.stringify(counts));
          if(counts.critical||counts.high||counts.moderate)
            throw new Error('Sigue existiendo vulnerabilidad conocida en producción; no publicar candidato');
          NODE
      - name: Pruebas completas de Worker + D1 de CI (no producción)
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:8787
          TEST_ADMIN_SETUP_KEY: ClaveSetupCIExclusivaParaPruebasDe36Caracteres123
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          WORKER_PID=""
          cleanup() {
            if [[ -n "$WORKER_PID" ]]; then
              kill "$WORKER_PID" 2>/dev/null || true
              wait "$WORKER_PID" 2>/dev/null || true
            fi
            rm -rf "$SANDBOX"
          }
          trap cleanup EXIT
          cd apps/api
          npx wrangler d1 migrations apply energia-vital-db --local --persist-to "$SANDBOX"
          npx wrangler dev --local --port 8787 --persist-to "$SANDBOX" \
            --var "JWT_SECRET:ClaveCIExclusivaParaPruebasDe36Caracteres123" \
            --var "ADMIN_SETUP_KEY:$TEST_ADMIN_SETUP_KEY" \
            >"$RUNNER_TEMP/isolated-worker-hono.log" 2>&1 &
          WORKER_PID=$!
          HEALTH_OK=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 2 "$BASE_URL/health" >/dev/null; then
              HEALTH_OK=1
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$HEALTH_OK" != 1 ]]; then
            echo "Worker de ensayo no inició"
            cat "$RUNNER_TEMP/isolated-worker-hono.log"
            exit 1
          fi
          cd ../..
          npm test --workspace=apps/api
      - name: Registrar solamente los dos archivos de dependencias en rama de ensayo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "El lockfile ya estaba actualizado."
          else
            git commit -m "fix(deps): actualizar Hono a 4.13.18 tras CI y audit de runtime"
            git push origin HEAD:security/hono-4-13-18
          fi
