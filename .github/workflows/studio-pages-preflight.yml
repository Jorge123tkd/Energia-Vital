name: Studio - comprobar publicación Pages
on:
  push:
    branches: [feat/cloudflare-customer-accounts-hardening]
    paths:
      - '.github/workflows/studio-pages-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar proyecto Pages y rama activa sin modificar Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('Credenciales de Cloudflare no disponibles en GitHub. No se ha publicado nada.');
          if(account!=='466af6f26fce494d6dc640128e200e24')throw Error('Cuenta Cloudflare no coincide con la infraestructura aprobada.');
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/energia-vital-web',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000),redirect:'error'});
          const data=await r.json();
          if(!r.ok||data.success!==true||data.result?.name!=='energia-vital-web')throw Error('Proyecto Pages no confirmado: HTTP '+r.status);
          const p=data.result;
          if(typeof p.production_branch!=='string'||!p.canonical_deployment?.id)throw Error('Rama o versión de retorno no confirmadas');
          console.log('Rama real de producción: '+p.production_branch);
          console.log('Despliegue de retorno: '+p.canonical_deployment.id);
          console.log('Rama de trabajo revisada: '+process.env.GITHUB_REF_NAME);
          const bindings=p.deployment_configs?.production?.services;
          console.log('Bindings Studio/Bonaire en Pages: '+(bindings?.STUDIO_API?.service==='evpro-sync-api'&&bindings?.ADMIN_SESSION_API?.service==='energia-vital-api'?'confirmados':'pendientes de verificar'));
          if(p.production_branch!==process.env.GITHUB_REF_NAME)throw Error('Rama productiva diferente: bloquear publicación hasta resolver la divergencia sin sobrescribir main.');
          console.log('PASS preflight Pages. No se modificó el sitio ni la API.');
          JS
