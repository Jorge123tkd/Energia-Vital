name: Validar y desplegar Energía Vital
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_confirmation:
        description: 'Escribe PUBLICAR_BONAIRE solo tras aprobar el lanzamiento'
        required: true
        type: string
      backup_confirmed:
        description: 'Respaldo externo cifrado de D1 creado y verificado'
        required: true
        type: boolean
        default: false
      migrations_reviewed:
        description: 'Migraciones remotas y prueba sobre copia histórica revisadas'
        required: true
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias del monorepo
        run: npm ci
      - name: Revisar TypeScript API
        run: npm run typecheck --workspace=apps/api
      - name: Revisar Svelte + TypeScript
        run: npm run typecheck --workspace=apps/web
      - name: Construir frontend
        run: npm run build --workspace=apps/web
      - name: Ensayo de preservación de datos históricos ficticios (sin Cloudflare real)
        run: python3 apps/api/tests/migration-preservation.py

      - name: Crear D1 de pruebas local (no production)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply energia-vital-db --local
      - name: Iniciar Cloudflare Worker local
        working-directory: apps/api
        run: |
          npx wrangler dev --local --port 8787 --var JWT_SECRET:ClaveCIExclusivaParaPruebasDe36Caracteres123 --var ADMIN_SETUP_KEY:ClaveSetupCIExclusivaParaPruebasDe36Caracteres123 >/tmp/energia-vital-worker.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/energia-vital-worker.log
          exit 1
      - name: Probar registro, aislamiento y operaciones con Worker + D1
        run: npm test --workspace=apps/api

  deploy-api:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_confirmation == 'PUBLICAR_BONAIRE' &&
      inputs.backup_confirmed == true &&
      inputs.migrations_reviewed == true
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirmar esquema D1 remoto antes de publicar (solo SELECT)
        working-directory: apps/api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute energia-vital-db --remote --json \
            --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type='table' AND name IN ('brigades','brigade_members','brigade_work','request_activities')" \
            > "$RUNNER_TEMP/bonaire-schema-count.json"
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const result = Array.isArray(raw) ? raw[0] : raw;
            const count = Number(result?.results?.[0]?.present);
            if (count !== 4) {
              console.error("D1 remota NO tiene las 4 tablas requeridas. Detenido antes de deploy.");
              process.exit(1);
            }
            console.log("Verificación de estructura D1 remota correcta (4 tablas esperadas).");
          ' "$RUNNER_TEMP/bonaire-schema-count.json"
      - name: Publicar Cloudflare Worker
        working-directory: apps/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Construir web con la URL pública del Worker
        run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Publicar Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name energia-vital-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
