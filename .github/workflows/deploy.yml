name: Validar y desplegar Energía Vital
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias del monorepo
        run: npm ci
      - name: Revisar TypeScript API
        run: npm run typecheck --workspace=apps/api
      - name: Revisar Svelte + TypeScript
        run: npm run typecheck --workspace=apps/web
      - name: Construir frontend
        run: npm run build --workspace=apps/web

  deploy-api:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publicar Cloudflare Worker
        working-directory: apps/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Construir web con la URL pública del Worker
        run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Publicar Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name energia-vital-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
