name: Bonaire D1 — auditoría remota SOLO LECTURA

# Solo se ejecuta por decisión humana desde GitHub Actions.
# No lanzar consultas a D1 remota automáticamente en cada cambio del script.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonaire-d1-audit-readonly
  cancel-in-progress: false

jobs:
  audit:
    name: Inventario D1 (SELECT sin PII ni archivos)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar herramientas de la rama (sin desplegar)
        run: npm ci
      - name: Consultar esquema, estado migraciones y comprobar conteos sin mostrarlos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/api/tests/d1-remote-readonly.cjs
      - name: Cierre de auditoría
        if: always()
        run: echo "No se ejecutan apply/export/execute con escrituras, wrangler deploy ni pages deploy."
