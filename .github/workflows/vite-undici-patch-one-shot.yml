name: Parche Vite 6 y Undici - prueba aislada temporal
on:
  push:
    branches: [security/vite-undici-20261116]
    paths: [docs/TRIGGER-VITE-UNDICI-PATCH.md]
permissions:
  contents: write
concurrency:
  group: vite-undici-patch-one-shot
  cancel-in-progress: false
jobs:
  patch-test:
    if: github.repository == 'Jorge123tkd/Energia-Vital' && github.ref == 'refs/heads/security/vite-undici-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Actualizar solo Vite y plugin compatible mediante npm
        run: npm install vite@6.4.6 @sveltejs/vite-plugin-svelte@5 --workspace=apps/web --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Fijar cota segura para Undici transitivo en la misma versión principal
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'overrides.undici=^7.30.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verificar alcance de cambios y versiones
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > "$RUNNER_TEMP/changed-deps.txt"
          if grep -Ev '^(package-lock\.json|package\.json|apps/web/package\.json)$' "$RUNNER_TEMP/changed-deps.txt"; then
            echo "Archivos cambiados fuera del alcance permitido."
            exit 1
          fi
          node - <<'NODE'
          const p=require('./package-lock.json');
          const pkg=require('./apps/web/package.json');
          const versions=(name)=>Object.entries(p.packages||{})
            .filter(([k])=>k==='node_modules/'+name||k.endsWith('/node_modules/'+name))
            .map(([k,v])=>({where:k,version:v.version,integrity:v.integrity}));
          const vite=versions('vite'),plugin=versions('@sveltejs/vite-plugin-svelte'),
                undici=versions('undici'),hono=versions('hono');
          console.log('Resolved version details:',JSON.stringify({vite:vite.map(x=>x.version),plugin:plugin.map(x=>x.version),undici:undici.map(x=>x.version),hono:hono.map(x=>x.version)}));
          if(!vite.length||vite.some(x=>!/^6\.4\.6$/.test(x.version)||!x.integrity))
            throw new Error('Vite 6.4.6 no instalado de forma íntegra');
          if(!plugin.length||plugin.some(x=>!/^5\./.test(x.version)||!x.integrity))
            throw new Error('Plugin Svelte 5 no es compatible o falta integridad');
          if(!undici.length||undici.some(x=>{
            const [major,minor,patch]=x.version.split('.').map(Number);
            return major!==7||(minor<30)||(minor===30&&patch<1)||!x.integrity;
          }))throw new Error('Undici no llegó a 7.30.1+ dentro de major 7');
          if(!hono.length||hono.some(x=>x.version!=='4.13.13'))
            throw new Error('No modificar Hono: actualización separada en PR #2');
          if(!pkg.devDependencies.vite.startsWith('^6.')||
            !pkg.devDependencies['@sveltejs/vite-plugin-svelte'].startsWith('^5.'))
            throw new Error('Manifiesto web inesperado');
          console.log('Vite:',vite.map(x=>x.version).join(', '));
          console.log('Svelte plugin:',plugin.map(x=>x.version).join(', '));
          console.log('Undici:',undici.map(x=>x.version).join(', '));
          console.log('Hono pendiente del PR #2:',hono.map(x=>x.version).join(', '));
          NODE
      - name: Comprobar instalación reproducible
        run: npm ci --no-fund
      - name: Comprobar API
        run: npm run typecheck --workspace=apps/api
      - name: Comprobar Svelte
        run: npm run typecheck --workspace=apps/web
      - name: Construir frontend
        run: npm run build --workspace=apps/web
      - name: Ensayar preservación de migraciones con datos ficticios
        run: python3 apps/api/tests/migration-preservation.py
      - name: Auditoría completa sin alertas altas/críticas
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit-candidate.json" || true
          node - "$RUNNER_TEMP/audit-candidate.json" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const c=d.metadata?.vulnerabilities;
          if(!c||!Number.isInteger(c.high)||!Number.isInteger(c.critical))
            throw new Error('Sin auditoría estructurada verificable');
          console.log('Vulnerabilidades restantes (incluye desarrollo):',JSON.stringify(c));
          for(const pkg of ['vite','undici'])if(d.vulnerabilities?.[pkg])
            throw new Error('Persisten alertas de '+pkg+'; no aceptar parche');
          if(c.high||c.critical)throw new Error('Persisten alertas graves; no aceptar parche');
          NODE
      - name: Integración completa Worker+D1 de CI (sin Cloudflare remoto)
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:8787
          TEST_ADMIN_SETUP_KEY: ClaveSetupCIExclusivaParaPruebasDe36Caracteres123
        run: |
          set -euo pipefail
          SANDBOX="$(mktemp -d)"
          WORKER_PID=""
          cleanup() {
            if [[ -n "$WORKER_PID" ]]; then
              kill "$WORKER_PID" 2>/dev/null || true
              wait "$WORKER_PID" 2>/dev/null || true
            fi
            rm -rf "$SANDBOX"
          }
          trap cleanup EXIT
          cd apps/api
          npx wrangler d1 migrations apply energia-vital-db --local --persist-to "$SANDBOX"
          npx wrangler dev --local --port 8787 --persist-to "$SANDBOX" \
            --var "JWT_SECRET:ClaveCIExclusivaParaPruebasDe36Caracteres123" \
            --var "ADMIN_SETUP_KEY:$TEST_ADMIN_SETUP_KEY" \
            >"$RUNNER_TEMP/vite-undici-worker.log" 2>&1 &
          WORKER_PID=$!
          HEALTH_OK=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 2 "$BASE_URL/health" >/dev/null; then
              HEALTH_OK=1
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$HEALTH_OK" != 1 ]]; then
            echo "Worker temporal no inició"
            cat "$RUNNER_TEMP/vite-undici-worker.log"
            exit 1
          fi
          cd ../..
          npm test --workspace=apps/api
      - name: Registrar exclusivamente los dos archivos de dependencias en rama aislada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json apps/web/package.json
          if git diff --cached --quiet; then
            echo "Sin cambios de dependencias."
          else
            git commit -m "fix(deps): parche Vite 6 y Undici con npm, audit y CI aislada"
            git push origin HEAD:security/vite-undici-20261116
          fi
